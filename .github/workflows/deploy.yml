# Production deploy path — this workflow is the only in-repo deployer.
#
# Competing system: the Cloudflare GitHub app ("Cloudflare Workers and Pages")
# also reports "Workers Builds: aizaz-studio" on pushes. That Git integration
# has been the path that actually updated production; this workflow has never
# completed a successful wrangler deploy (runs 1–17). Disconnect Builds in
# dash.cloudflare.com → Workers → aizaz-studio → Settings → Builds so only
# this workflow can ship Worker versions.
#
# Required GitHub Actions secrets:
#   CLOUDFLARE_API_TOKEN  — token on account 54d8ce3fa765fe69f73c366be3d98f69
#                           with Workers Scripts Edit, Account Settings Read,
#                           and Zone Workers Routes Edit + Zone Read for aizaz.studio
#   CLOUDFLARE_ACCOUNT_ID — optional; if set must equal wrangler.jsonc account_id
#
# cache.enabled requires Wrangler >= 4.69.0 (this repo pins wrangler@4.120.1).
# Older CLIs warn: Unexpected fields found in top-level field: "cache".

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ACCOUNT_ID: 54d8ce3fa765fe69f73c366be3d98f69
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Create a token on account ${EXPECTED_ACCOUNT_ID} (Edit Cloudflare Workers + Zone Workers Routes for aizaz.studio) and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] && [ "${CLOUDFLARE_ACCOUNT_ID}" != "${EXPECTED_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is stale. Expected ${EXPECTED_ACCOUNT_ID} (wrangler.jsonc account_id / production Worker dashboard). Update or remove the secret."
            exit 1
          fi
          echo "Using project Wrangler $(./node_modules/.bin/wrangler --version)"
          WHOAMI="$(./node_modules/.bin/wrangler whoami)"
          printf '%s\n' "${WHOAMI}"
          if ! printf '%s\n' "${WHOAMI}" | grep -q "${EXPECTED_ACCOUNT_ID}"; then
            echo "::error::CLOUDFLARE_API_TOKEN is not attached to production account ${EXPECTED_ACCOUNT_ID}. Recreate the token on that account."
            exit 1
          fi

      # Use the repo-pinned binary. wrangler-action wraps `npx wrangler deploy`
      # and reports only "npx failed with exit code 1" (runs 1–17).
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy
